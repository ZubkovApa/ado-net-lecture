services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Общая сеть с базой: из программы сервер доступен как localhost:5432
    network_mode: service:db

  db:
    image: postgres:17
    restart: unless-stopped
    # Журнал выполненных запросов (pg_stat_statements) — по нему работает check.sh
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"   # тот же пароль, что на слайдах
      POSTGRES_DB: university      # база создаётся сама, CREATE DATABASE не нужен

volumes:
  postgres-data:
